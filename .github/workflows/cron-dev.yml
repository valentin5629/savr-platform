name: cron-dev

# Vercel ne lance les crons que sur le déploiement de PRODUCTION : sur l'alias
# `dev` (Preview, base savr-dev) rien d'asynchrone ne partait seul. Ce workflow
# appelle donc sur dev les 14 routes cron de `packages/plateforme/vercel.json`,
# pour que dev réagisse comme la production (décision Val 2026-11-13).
#
# Fréquences = celles de vercel.json (heures UTC), minutes décalées pour ne pas
# tomber sur le haut de l'heure, encombré chez GitHub. Seule différence voulue :
# outbox-worker et polling-mts1 passent toutes les 5 min au lieu de 15
# (décisions Val #552 et 2026-11-12, inchangées).
#   */5      outbox-worker, process-attributions-ag, polling-mts1, pdf-worker, email-retry
#   */15     batch-pdf-j1, revalidation-siret, notify-pack-etat
#   */30     pennylane-retry
#   1 h      cloture-embargo
#   00 h     refresh-benchmark    01 h  polling-pennylane
#   02 h     purge-logs           04 h  batch-brouillons-j1
#
# ⚠ Ces routes écrivent dans la base de dev PARTAGÉE comme en production, et ce
# qu'elles écrivent ne se défait pas : collecte « Réalisée » sur fin de mission,
# clôture à 48 h, numéros de documents, PDF, emails « document disponible ».
# outbox-worker fait de vrais appels aux prestataires (MTS-1, A Toute!). Les
# emails suivent la garde hors production (redirigés vers EMAIL_REDIRECT_TO ou
# non envoyés) ; la facturation reste éteinte (batch-brouillons-j1 répond
# `desactive`).
#
# Secrets de dépôt requis (Settings → Secrets and variables → Actions) :
#   CRON_SECRET_DEV      = valeur de CRON_SECRET du Preview Vercel
#   VERCEL_BYPASS_DEV    = secret « Protection Bypass for Automation » du projet
# Absents : le workflow s'arrête en succès avec un avertissement (jamais de CI rouge).
# GitHub ne planifie que depuis la branche par défaut, avec quelques minutes de
# retard, et peut sauter un passage : dev est proche de la production, pas exact.

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '1,16,31,46 * * * *'
    - cron: '3,33 * * * *'
    - cron: '8 * * * *'
    - cron: '11 0 * * *'
    - cron: '11 1 * * *'
    - cron: '11 2 * * *'
    - cron: '11 4 * * *'
  workflow_dispatch:
    inputs:
      groupe:
        description: 'Routes à appeler'
        type: choice
        default: cinq-minutes
        options:
          - cinq-minutes
          - quart-heure
          - demi-heure
          - heure
          - nuit
          - tout

# Un groupe par planification : un passage long (jusqu'à 5 min) ne retarde ni
# n'annule celui d'un autre rythme. Les routes tiennent elles-mêmes les
# passages concurrents (lease/claim), comme en production.
concurrency:
  group: cron-dev-${{ github.event.schedule || inputs.groupe }}
  cancel-in-progress: false

permissions: {}

env:
  BASE_URL: https://savr-platform-git-dev-savr-s-projects.vercel.app

jobs:
  appeler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Appeler les crons de dev
        env:
          CRON_SECRET_DEV: ${{ secrets.CRON_SECRET_DEV }}
          VERCEL_BYPASS_DEV: ${{ secrets.VERCEL_BYPASS_DEV }}
          PLANIFICATION: ${{ github.event.schedule }}
          GROUPE: ${{ inputs.groupe }}
        run: |
          if [ -z "$CRON_SECRET_DEV" ] || [ -z "$VERCEL_BYPASS_DEV" ]; then
            echo "::warning::CRON_SECRET_DEV ou VERCEL_BYPASS_DEV absent : aucun cron appelé."
            exit 0
          fi
          echo "::add-mask::$CRON_SECRET_DEV"
          echo "::add-mask::$VERCEL_BYPASS_DEV"

          cinq='outbox-worker process-attributions-ag polling-mts1 pdf-worker email-retry'
          quart='batch-pdf-j1 revalidation-siret notify-pack-etat'
          demi='pennylane-retry'
          heure='cloture-embargo'
          nuit='refresh-benchmark polling-pennylane purge-logs batch-brouillons-j1'
          case "$PLANIFICATION" in
            '*/5 * * * *')        routes=$cinq ;;
            '1,16,31,46 * * * *') routes=$quart ;;
            '3,33 * * * *')       routes=$demi ;;
            '8 * * * *')          routes=$heure ;;
            '11 0 * * *')         routes='refresh-benchmark' ;;
            '11 1 * * *')         routes='polling-pennylane' ;;
            '11 2 * * *')         routes='purge-logs' ;;
            '11 4 * * *')         routes='batch-brouillons-j1' ;;
            '')
              case "$GROUPE" in
                cinq-minutes) routes=$cinq ;;
                quart-heure)  routes=$quart ;;
                demi-heure)   routes=$demi ;;
                heure)        routes=$heure ;;
                nuit)         routes=$nuit ;;
                tout)         routes="$cinq $quart $demi $heure $nuit" ;;
                *) echo "::error::groupe inconnu : $GROUPE"; exit 1 ;;
              esac ;;
            *) echo "::error::planification inconnue : $PLANIFICATION"; exit 1 ;;
          esac

          # Appels en parallèle, comme les crons Vercel ; borne = durée maximale
          # la plus longue des routes (300 s) + marge.
          dossier=$(mktemp -d)
          for route in $routes; do
            ( code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 330 \
                -H "Authorization: Bearer $CRON_SECRET_DEV" \
                -H "x-vercel-protection-bypass: $VERCEL_BYPASS_DEV" \
                "$BASE_URL/api/cron/$route") || code="erreur-reseau"
              echo "$code" > "$dossier/$route" ) &
          done
          wait

          statut=0
          for route in $routes; do
            code=$(cat "$dossier/$route")
            echo "$route -> HTTP $code"
            case "$code" in 2*) ;; *) statut=1 ;; esac
          done
          exit $statut
