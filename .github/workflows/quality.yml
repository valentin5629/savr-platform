name: Quality Gate
# Sur les PR seulement (décision Val 2026-10-25, audit CI). La protection de `main`
# exige une branche à jour (`strict: true`) et les checks requis verts : l'arbre
# fusionné par squash est exactement celui que le passage de la PR a testé. Le
# passage `push: main` qui suivait chaque fusion (42 % des passages) ne prouvait
# rien de plus et occupait la file. `push: dev` ne se déclenchait plus : sync-dev
# pousse avec le GITHUB_TOKEN. `workflow_dispatch` permet un passage à la main.
on:
  pull_request:
  workflow_dispatch:

# Un nouveau push sur une PR rend le passage en cours sans objet : son verdict
# porte sur un commit qui n'est plus la tête de la branche. On l'annule.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Noms des 8 checks REQUIS sur `main` (BRANCH_PROTECTION.md) : `detect-prereqs`,
# `lint-typecheck-test`, `anti-coupling`, `migration-timestamp`, `security`,
# `pgtap-rls-outbox`, `migrations`, `gate-ratchet`. Renommer ou retirer l'un d'eux
# laisse toutes les PR bloquées en « Expected » tant que la protection n'est pas
# modifiée. Un job requis ne doit jamais être sauté par un `if` (statut « Success »).
jobs:
  # Check requis historique : il détectait migrations / Playwright / Next pour des
  # jobs différés du module 0.1. Ces trois prérequis existent depuis longtemps ; le
  # job ne fait plus que rendre son statut, il n'est plus en tête d'aucun autre.
  detect-prereqs:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Prérequis permanents (migrations, Playwright, Next) — rien à détecter."

  # ── lint-typecheck-test (requis) = statique + unit + build ─────────────────
  # Les trois tournent en parallèle ; `lint-typecheck-test` les agrège. Il passe
  # TOUJOURS (`!cancelled()`) et vérifie lui-même chaque résultat : un job requis
  # sauté parce qu'une dépendance a échoué compterait comme « Success ».
  statique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w format:check
      - run: pnpm -w typecheck
      - run: pnpm -w lint
      # check:coverage ne tourne qu'en local (/goal) : sans cet auto-test, rien ne
      # verrait le detecteur redevenir muet (ENOBUFS au-dela de 1 Mio le 2026-09-30 :
      # tous les scenarios « MANQUANT » sur tous les modules). Faux Vitest, 3 s.
      - run: pnpm check:coverage --self-test
      # Sa baseline (livrables a preuve non resolue toleres) ne peut que descendre :
      # toute entree absente de main (ou au texte change) rougit le job.
      - name: Baseline check:coverage — aucun ajout par rapport a main
        run: |
          git fetch --quiet --depth=1 origin main:refs/remotes/origin/main
          pnpm check:coverage --verifier-baseline origin/main

  # Suite Vitest complète, en deux parts sur deux runners (la suite est limitée
  # par le CPU : 130 à 230 s sur un seul runner, mesuré le 2026-10-25).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w test:unit --shard=${{ matrix.part }}/2

  # Build de tout le monorepo SANS variables d'environnement, comme avant dans
  # lint-typecheck-test : il attrape un client Supabase créé au chargement d'un
  # module (le build casse sans .env). Le budget du bundle se lit sur ce build au
  # lieu d'en refaire un. Sauté (job vert) quand la PR ne touche que specs/,
  # docs/, fixtures/, supabase/, .claude/ ou des .md (scripts/ci-perimetre.sh).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # commit de fusion + sa base : fichiers de la PR
      - id: perimetre
        name: Périmètre de la PR (scripts/ci-perimetre.sh)
        run: bash scripts/ci-perimetre.sh
      - if: steps.perimetre.outputs.build != 'false'
        uses: pnpm/action-setup@v4
      - if: steps.perimetre.outputs.build != 'false'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - if: steps.perimetre.outputs.build != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.perimetre.outputs.build != 'false'
        run: pnpm -w build
      # Seuil V1 minimal : taille .next/static < 5 MB.
      - if: steps.perimetre.outputs.build != 'false'
        name: Vérification budget bundle
        run: |
          SIZE=$(du -sb packages/plateforme/.next/static 2>/dev/null | cut -f1 || echo 0)
          echo "Bundle static size: ${SIZE} bytes"
          if [ "${SIZE}" -gt 5242880 ]; then
            echo "::error::Bundle trop lourd (${SIZE} bytes > 5 MB)" ; exit 1
          fi

  lint-typecheck-test:
    needs: [statique, unit, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Statique, tests unitaires et build tous verts
        run: |
          echo "statique=${{ needs.statique.result }} unit=${{ needs.unit.result }} build=${{ needs.build.result }}"
          [ "${{ needs.statique.result }}" = success ] &&
          [ "${{ needs.unit.result }}" = success ] &&
          [ "${{ needs.build.result }}" = success ]

  # Garde-fou 3 TMS-Ready : anti-couplage MTS-1/Everest (deterministe, sans DB).
  # Echec = reference directe a un transporteur hors packages/adapters/.
  # Porte aussi trois gardes légères qui se disaient « bloquantes » sans être
  # requises (décision Val 2026-10-25, C4) — elles le sont désormais :
  #   • pdf-contract : liste des type_document du worker ↔ renderer PDF (le
  #     renderer, build Docker hors workspace, la duplique) ;
  #   • G8 primitives orphelines (logger / sendAlert / captureException) ;
  #   • contrats outbox V2 (garde-fou G2 TMS-Ready, schémas E1/E2/E3/E5).
  anti-coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-coupling.sh
      - name: G8 — primitives orphelines
        run: bash scripts/check-primitive-orpheline.sh
      - name: Contrats outbox V2
        run: bash scripts/check-outbox-contracts.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Contrat worker ↔ renderer PDF
        run: pnpm -w check:pdf-contract

  # Anti-collision de timestamp de migration (R0d) — 5 occurrences vecues.
  # Le hook pre-commit ne voit que le dossier de SA branche : aveugle a une
  # migration portee par une branche EN VOL (ni mergee, ni sur main). Ce job est
  # le seul endroit ou l'on compare a TOUS les refs distants, d'ou fetch-depth: 0
  # + fetch explicite des heads (le checkout d'une PR ne ramene que la merge ref).
  # Le --self-test tourne AVANT le controle reel : un detecteur inerte doit rougir
  # de lui-meme plutot que de laisser passer une collision en silence.
  migration-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Recuperer toutes les branches distantes
        run: git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Auto-test du detecteur (non-vacuite)
        run: bash scripts/check-migration-timestamp.sh --self-test
      # Le hook de merge n'est joue que par Claude Code, jamais en CI : sans cet
      # auto-test, un resserrement de son motif le rendrait muet sans que personne
      # ne le sache. C'est arrive une fois (il ne voyait plus `if gh pr merge …;
      # then`, la forme imposee par le projet). Pur test de chaines, instantane.
      - name: Auto-test du hook de merge (matrice des formes de commande)
        run: bash .claude/hooks/gate-merge.sh --self-test
      # Même raison pour les gardes de commit et de création de PR, elles aussi
      # jouées par Claude Code seul : le motif qui reconnaît la commande, le
      # périmètre des tests liés au commit, et la trace « suite déjà verte sur ce
      # contenu ». Un périmètre qui oublie une source, ou une trace qui survit à un
      # changement de contenu, rendrait une garde verte à tort sans que rien ne le
      # montre. Dépôts jetables, ne lisent pas le dépôt réel.
      - name: Auto-test des gardes de commit et de création de PR
        run: |
          bash .claude/hooks/pre-commit-gate.sh --self-test
          bash .claude/hooks/gate-pr.sh --self-test
          bash .claude/hooks/tests-lies.sh --self-test
          bash .claude/hooks/suite-verte.sh --self-test
      # Même raison encore pour les deux autres gardes de l'outil Bash, jouées par
      # Claude Code seul : celle qui bloque les commandes destructives et celle qui
      # sérialise les écritures dans la base partagée. Chaque auto-test rejoue le
      # hook ENTIER (charge JSON sur l'entrée standard, code de sortie lu), dont des
      # commandes de plus de 300 000 caractères : lues par un tube sous `pipefail`,
      # celles où 300 000 caractères suivaient la ligne du motif passaient sans
      # être vues. Celui de db-guard travaille dans un dépôt jetable, après avoir
      # retiré les variables GIT_* héritées, puis se rejoue lui-même sous trois
      # sortes de piège (variables GIT_*, configuration git, mktemp) pour vérifier
      # que le dépôt désigné par ces pièges reste intact et que le dossier de
      # lancement n'est pas supprimé.
      - name: Auto-test des gardes de commandes destructives et d'écriture en base partagée
        run: |
          bash .claude/hooks/block-destructive.sh --self-test
          bash .claude/hooks/db-guard.sh --self-test
      # Le lanceur local de pgTAP (`pnpm test:pgtap`) n'est joué par aucun job :
      # la CI passe par `supabase test db`. Jusqu'au 2026-10-09 il rendait vert un
      # fichier rouge sans que rien ne le montre. Les deux autres lisaient la
      # sortie de psql, ou celle du CLI Supabase, par la même forme de tube (cf.
      # leurs en-têtes). Faux psql et faux CLI Supabase en tête du PATH, pas de base.
      - name: Auto-test de trois scripts qui lisent une sortie de psql ou du CLI Supabase
        run: |
          bash scripts/test-pgtap.sh --self-test
          bash scripts/check-query-perf.sh --self-test
          bash scripts/smoke-test-db.sh --self-test
      # Le script de synchro des specs n'est joué par aucun job : le Vault n'est pas
      # en CI. Jusqu'au 2026-10-21, une copie qui n'aboutissait pas passait sans
      # bruit, specs/SYNC.md était quand même daté du jour, et l'option --auto
      # committait sur la branche extraite. Dépôts et Vault jetables ; un faux rsync
      # simule les copies en échec ; l'auto-test se rejoue sous les pièges de
      # .claude/hooks/lib-auto-test.sh (variables GIT_*, configuration git, mktemp
      # muet, bibliothèque absente).
      - name: Auto-test du script de synchro des specs
        run: bash scripts/sync-specs.sh --self-test
      # Démarrage de la pile Supabase de la CI : repli sur public.ecr.aws puis
      # docker.io quand ghcr.io refuse, deux tours au plus (incident du
      # 2026-10-22, 429 sur supabase/postgres pendant des heures, puis refus de
      # public.ecr.aws aussi). Faux CLI Supabase en tête du PATH, pas de Docker.
      - name: Auto-test du démarrage Supabase de la CI (repli de registre)
        run: bash scripts/ci-supabase-start.sh --self-test
      # Le classement des fichiers d'une PR décide des étapes sautées : un classement
      # faux sauterait la base ou le build à tort.
      - name: Auto-test du périmètre de la CI (étapes sautées selon les fichiers)
        run: bash scripts/ci-perimetre.sh --self-test
      - name: Collision de timestamp, y compris avec une branche non mergee
        run: bash scripts/check-migration-timestamp.sh --branch

  # Renderer PDF (apps/pdf-renderer), sauté quand la PR n'y touche pas.
  #   • Lockfile npm : le build Railway fait `npm ci` sur apps/pdf-renderer/
  #     package-lock.json ; il doit être EXACTEMENT celui que produit la commande du
  #     Dockerfile (même image node:22-slim). `npm ci --dry-run` ne suffit pas : il
  #     laisse passer une dépendance retirée ou déplacée en devDependencies.
  #   • Build Docker + démarrage : Dockerfile cassé (#272), dépendance d'exécution en
  #     devDependencies, compilation sur l'arbre npm.
  pdf-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        name: Renderer modifié ?
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             git diff --quiet "${{ github.event.pull_request.base.sha }}...HEAD" -- \
               apps/pdf-renderer .github/workflows/quality.yml; then
            echo "apps/pdf-renderer/ inchangé : contrôles du renderer sautés."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Régénère le lockfile avec la commande du Dockerfile
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/pdf-renderer
        run: |
          docker run --rm -v "$PWD":/w -w /w node:22-slim \
            npm install --package-lock-only --ignore-scripts
      - name: package-lock.json synchronisé avec package.json
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/pdf-renderer
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error file=apps/pdf-renderer/package-lock.json::package-lock.json désynchronisé de package.json. Depuis apps/pdf-renderer/ : docker run --rm -v \"\$PWD\":/w -w /w node:22-slim npm install --package-lock-only --ignore-scripts, puis commiter package-lock.json."
            exit 1
          fi
      - if: steps.changed.outputs.run == 'true'
        run: docker build -t savr-pdf-renderer apps/pdf-renderer
      - if: steps.changed.outputs.run == 'true'
        name: Le conteneur démarre et /health répond
        run: |
          docker run -d --name pdf-renderer -p 3001:3001 \
            -e RAILWAY_PDF_SECRET=ci-smoke savr-pdf-renderer
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 1
          done
          docker logs pdf-renderer
          exit 1

  # La base, démarrée UNE fois (au lieu de six jobs qui la démarraient chacun,
  # ~2 min par démarrage, mesuré le 2026-10-25) :
  #   • application de toutes les migrations sur une base neuve (`db reset`, trois
  #     essais sur chute de conteneur) — ce que faisait le job `migrations` ;
  #   • `supabase test db` : TOUS les *.test.sql de supabase/tests/ — RLS sous rôle
  #     'authenticated' (non négociable), garde-fou 4 (outbox par mutation), et
  #     depuis le 2026-10-25 (décision Val C3) les oracles sémantiques G9 et les
  #     postconditions integration-contracts, sortis du mode rapport ;
  #   • plans des requêtes critiques (perf-check), informatif comme avant : il
  #     n'était pas requis, il ne bloque pas.
  # Le rapport G6 (schéma V1 vs DDL cible V2) ne tourne plus en CI : il signalait
  # les mêmes écarts à chaque passage sans rien bloquer. À la demande, sur une base
  # locale : `pnpm check:schema-vs-cible` (DATABASE_URL + CIBLE_DATABASE_URL).
  # Joue sans condition : status check REQUIS. Ses étapes de base sont sautées (job
  # vert) quand la PR ne touche ni supabase/, ni .github/, ni scripts/ : le résultat
  # des tests pgTAP ne dépend que de supabase/, déjà vérifié sur main
  # (scripts/ci-perimetre.sh, décision Val 2026-10-25).
  pgtap-rls-outbox:
    runs-on: ubuntu-latest
    # 30 et non 10 : le démarrage de la pile peut faire jusqu'à six essais de
    # registre (scripts/ci-supabase-start.sh), 1 à 4 min chacun quand il échoue.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # commit de fusion + sa base : fichiers de la PR
      - id: perimetre
        name: Périmètre de la PR (scripts/ci-perimetre.sh)
        run: bash scripts/ci-perimetre.sh
      - if: steps.perimetre.outputs.base != 'false'
        uses: supabase/setup-cli@v1
        with: { version: 2.105.0 }
      - if: steps.perimetre.outputs.base != 'false'
        run: bash scripts/ci-supabase-start.sh
        env:
          SUPABASE_NO_ANALYTICS: 'true'
      # `supabase start` rend la main avant que Postgres soit pleinement stable.
      # On attend que pg_isready réponde 3x d'affilée AVANT le reset : sans ce
      # filet, le conteneur chute parfois au passage migrate→seed (faux positif
      # infra récurrent, ≠ erreur SQL — cf. PR #62 run 27772196968).
      - if: steps.perimetre.outputs.base != 'false'
        name: Attente Postgres prêt et stable (avant reset)
        run: |
          ok=0
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -q; then
              ok=$((ok + 1))
              if [ "$ok" -ge 3 ]; then
                echo "Postgres stable ($ok checks consécutifs)."
                exit 0
              fi
            else
              ok=0
            fi
            sleep 2
          done
          echo "::warning::Postgres pas confirmé stable après 60s — reset tenté (avec retry)."
      # Retry sur la chute de conteneur infra : le reset recrée la base à zéro,
      # donc re-tenter est idempotent. On redémarre le stack entre tentatives
      # pour repartir d'un conteneur sain. --debug seulement à la dernière
      # tentative (diagnostic), sinon firehose de logs qui charge le runner.
      - if: steps.perimetre.outputs.base != 'false'
        name: Run supabase db reset (retry sur chute conteneur infra)
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            flags=""
            [ "$attempt" -eq 3 ] && flags="--debug"
            echo "::group::supabase db reset — tentative $attempt/3"
            if supabase db reset $flags; then
              echo "::endgroup::"
              echo "db reset OK (tentative $attempt/3)."
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::db reset KO (tentative $attempt/3) — redémarrage du stack puis nouvelle tentative."
            supabase stop --no-backup || true
            bash scripts/ci-supabase-start.sh
            for i in $(seq 1 30); do
              pg_isready -h 127.0.0.1 -p 54322 -U postgres -q && break
              sleep 2
            done
          done
          echo "::error::supabase db reset a échoué après 3 tentatives (chute conteneur persistante)."
          exit 1
        env:
          SUPABASE_NO_ANALYTICS: 'true'
      - if: steps.perimetre.outputs.base != 'false'
        run: supabase test db # RLS, outbox par mutation, G9, integration-contracts
      - if: steps.perimetre.outputs.base != 'false'
        name: Plans des requêtes critiques (informatif)
        continue-on-error: true
        run: bash scripts/check-query-perf.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres

  # Build + start en mode production pour eviter le timeout du webServer dev
  # (Next.js 15 en mode dev depasse les 120s de compilation a froid sur le runner).
  # Build distinct de `build` : les NEXT_PUBLIC_* sont figées dans le bundle au
  # build, il faut celles du serveur local. Seul Chromium est installé (navigateur
  # par défaut du projet Playwright). Sauté comme `build` (scripts/ci-perimetre.sh).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # commit de fusion + sa base : fichiers de la PR
      - id: perimetre
        name: Périmètre de la PR (scripts/ci-perimetre.sh)
        run: bash scripts/ci-perimetre.sh
      - if: steps.perimetre.outputs.build != 'false'
        uses: pnpm/action-setup@v4
      - if: steps.perimetre.outputs.build != 'false'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - if: steps.perimetre.outputs.build != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.perimetre.outputs.build != 'false'
        name: Build Next.js pour les tests E2E
        run: pnpm --filter @savr/plateforme build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      - if: steps.perimetre.outputs.build != 'false'
        name: Démarrer le serveur Next.js en arrière-plan
        run: pnpm --filter @savr/plateforme start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      - if: steps.perimetre.outputs.build != 'false'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.perimetre.outputs.build != 'false'
        name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001 > /dev/null 2>&1 && break
            sleep 1
          done
      - if: steps.perimetre.outputs.build != 'false'
        run: pnpm -w test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001

  # Install du binaire gitleaks directement : `gitleaks-action@v2` exige une
  # licence (faux positif sur repos perso). Le CLI open source ne l'exige pas.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1
      - uses: pnpm/action-setup@v4
      - run: pnpm audit --audit-level=high || true

  # Garde anti-destructif des migrations nouvelles (sans base). L'application des
  # migrations sur une base neuve est faite par `pgtap-rls-outbox`, qui démarre la
  # seule base de la CI. Joue sans condition : status check REQUIS.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Garde anti-destructif
        run: |
          FILES=$(git diff --name-only origin/main... -- 'supabase/migrations/**')
          if [ -z "$FILES" ]; then
            echo "Aucune migration nouvelle — garde anti-destructif skippé."; exit 0
          fi
          DESTRUCTIVE=$(echo "$FILES" | xargs grep -Eil 'drop +(table|column)|truncate' || true)
          if [ -z "$DESTRUCTIVE" ]; then exit 0; fi
          FAIL=false
          for f in $DESTRUCTIVE; do
            if grep -qi -- '-- REVIEWED-DESTRUCTIVE:' "$f"; then
              echo "✅ $f — revue documentée :"
              grep -i -- '-- REVIEWED-DESTRUCTIVE:' "$f"
            else
              echo "::error::Migration destructive sans marqueur -- REVIEWED-DESTRUCTIVE: dans $f"
              FAIL=true
            fi
          done
          if [ "$FAIL" = "true" ]; then exit 1; fi

  # ===========================================================================
  # R0d — MÉTA-CLIQUET anti-régression. SEUL gate Lot 0 BLOQUANT (continue-on-error
  # absent). Les gates G1/G2/G7/G10/G11 restent en mode rapport (ils observent le
  # backlog), MAIS ce job échoue si l'un de leurs compteurs DÉPASSE sa baseline
  # versionnée (docs/audit/gate-baseline.json) → toute NOUVELLE divergence rougit,
  # sans avoir à flipper chaque gate. Un lot qui corrige fait baisser la baseline
  # (pnpm check:ratchet --update). Pas de DB requise (snapshot db.types committé).
  gate-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Régénère .cdc-metadata.json (cohérence G11 dans le cliquet)
        run: pnpm gen:cdc-metadata
      # Le --self-test tourne AVANT le cliquet : un G12 redevenu muet y compterait
      # zéro sans rien dire (2026-10-06 : « 0 décrochée / 440 » avec 61 refs sur un
      # passage étranger). Dépôt jetable, 5 s, ne lit pas le dépôt réel.
      - name: Auto-test G12 — le suivi des ref_cdc voit encore ce qu'il doit voir
        run: pnpm check:manifest-ref-anchor --self-test
      - name: Méta-cliquet — aucun compteur de gate au-dessus de sa baseline
        run: pnpm check:ratchet
