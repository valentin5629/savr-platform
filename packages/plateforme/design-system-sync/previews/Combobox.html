<div id="root" style="padding:20px"></div>
<script>

function Demo(){
  const [v,setV]=React.useState(null); const [s,setS]=React.useState('validee');
  return h('div',{className:'flex flex-wrap items-center gap-6'},
    h('div',{className:'w-72'},h(S.Combobox,{placeholder:"Lieu de l'événement",searchPlaceholder:'Rechercher un lieu…',options:OPTS,value:v,onChange:setV})),
    h(S.Combobox,{titre:'Statut',placeholder:'Tous',value:s,onChange:setS,options:[{value:'programmee',label:'Programmée'},{value:'validee',label:'Validée'},{value:'cloturee',label:'Clôturée'}]}),

}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
